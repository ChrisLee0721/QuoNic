[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quonic"
version = "0.12.0"
description = "Quantum programming as simple as Python — 12+ backends, intelligent scheduling, 77 algorithms"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ChrisLee", email = "Christina_Llap_Yuen@outlook.com" }]
keywords = [
    "quantum",
    "quantum-computing",
    "quantum-simulation",
    "quantum-programming",
    "qiskit",
    "cirq",
    "pennylane",
    "qulacs",
    "tensorcircuit",
    "cuda-quantum",
    "gpu",
    "simulation",
    "backend-agnostic",
    "quantum-error-correction",
    "quantum-machine-learning",
    "grover",
    "vqe",
    "qaoa",
]
dependencies = ["numpy>=1.24"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ChrisLee0721/QuoNic"
Documentation = "https://chrislee0721.github.io/QuoNic/"
Repository = "https://github.com/ChrisLee0721/QuoNic"
Changelog = "https://github.com/ChrisLee0721/QuoNic/blob/main/CHANGELOG.md"

[project.optional-dependencies]
qiskit = ["qiskit>=1.0", "qiskit-aer>=0.14"]
cirq = ["cirq>=1.0"]
pennylane = ["pennylane>=0.36"]
quantum-inspire = ["qiskit-quantuminspire>=0.18", "quantuminspire>=4.0", "qiskit<2.4.0"]
algorithms = ["numpy>=1.24", "scipy>=1.10"]
viz = ["matplotlib>=3.5"]
qulacs = ["qulacs>=0.6"]
tensorcircuit = ["tensorcircuit>=0.12"]
cudaq = ["cuda-quantum>=0.8"]
mindquantum = ["mindquantum>=0.9"]
qpanda = ["pyqpanda3>=3.0"]
cqlib = ["cqlib>=0.1"]
gpu = ["cupy-cuda12x>=13.0"]
ibm = ["qiskit-ibm-runtime>=0.20"]
braket = ["amazon-braket-sdk>=1.50"]
azure = ["azure-quantum>=2.0"]
ionq = ["ionq-cirq>=0.5"]
rigetti = ["pyquil>=4.0"]
xanadu = ["strawberryfields>=0.23"]
quera = ["qurry>=0.1"]
chem = ["pyscf>=2.5", "openfermion>=1.6"]
chem-rdkit = ["quonic[chem]", "rdkit>=2024.3"]
drug = ["quonic[chem-rdkit]"]
docs = ["mkdocs>=1.6", "mkdocstrings[python]>=0.26", "mkdocs-material>=9.5"]
all-sim = ["quonic[qulacs,tensorcircuit,cudaq,mindquantum,qpanda,cqlib]"]
all-hw = ["quonic[ibm,braket,azure,ionq,rigetti,xanadu,quera]"]
dev = ["pytest>=7.0", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.5", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quonic = ["py.typed", "scheduler/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
